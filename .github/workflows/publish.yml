name: Publish main

# Постійні адреси замість артефактів по PR: після зеленого "Godot Tests" на main
#   • rolling-prerelease `main-latest` з підписаним APK;
# Кожна збірка має штамп (sha · № запуску · дата) у ☰-меню — див. godot/scripts/build_info.gd.

on:
  workflow_run:
    workflows: ["Godot Tests"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-main
  cancel-in-progress: true

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: out
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Rolling prerelease main-latest
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -e
          test -s out/RealWorld.apk
          gh release delete main-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create main-latest out/RealWorld.apk \
            --repo "$GITHUB_REPOSITORY" --prerelease --target "$SHA" \
            --title "main · ${SHA::7}" \
            --notes "Автозбірка main (${SHA}). Номер збірки — у ☰-меню гри. Основна капсула ввімкнена за замовчуванням (OD-114); опт-аут до старого шляху — `-- nocapsule`."
