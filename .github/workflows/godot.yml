name: Godot Tests

# push is limited to main so PR-branch pushes run every job once (via pull_request),
# not twice — the bare push trigger duplicated the whole matrix on every PR push
on:
  push:
    branches: [main]
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -O https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot-bin
          chmod +x godot-bin
      # every suite is leak-gated: RefCounted cycles (Thing<->Comp etc.) print an ObjectDB warning at
      # exit instead of failing the run, so the gate greps for it — leaks must not return silently.
      # ONE loop, one gate: adding a suite = adding a name to the list (no copy-pasted gate to forget)
      - name: Headless suites (leak-gated)
        run: |
          set -o pipefail
          for suite in run_tests run_kernel_tests run_catalog_tests run_progression_tests run_ui_tests run_determinism_tests run_snapshot_tests run_command_tests run_rejoin_tests run_capsule_tests run_realtime_tests run_smoke; do
            echo "=== $suite ==="
            ./godot-bin --headless --path godot -s "res://tests/$suite.gd" 2>&1 | tee suite.log
            ! grep -q "ObjectDB instances were leaked" suite.log
          done
      # spec 0006 §4: "same seed fed to two independent server instances -> identical world state
      # hash" — two separate OS processes, not two objects in one process, so per-process
      # nondeterminism (hash seeds, pointer order) has nowhere to hide.
      - name: Cross-process determinism hash
        run: |
          # two lines per process: WORLD_HASH_FINAL (OFF world) and WORLD_HASH_CAPSULE (spec 0010, ON world) — both are diffed
          ./godot-bin --headless --path godot -s res://tests/run_determinism_tests.gd 2>&1 | grep -E "^WORLD_HASH_(FINAL|CAPSULE)=" > h1.txt
          ./godot-bin --headless --path godot -s res://tests/run_determinism_tests.gd 2>&1 | grep -E "^WORLD_HASH_(FINAL|CAPSULE)=" > h2.txt
          test "$(wc -l < h1.txt)" = 2
          diff h1.txt h2.txt && cat h1.txt
      # spec 0006 plan §2 end-to-end: 1 authoritative --headless server + 2 client processes over
      # a real localhost WebSocket, lockstep command echo — world_hash must match on all three.
      # Integration suite (spawns OS processes), so it runs outside the single-process loop above.
      - name: Net transport spike (server + 3 clients, one joining mid-run)
        run: ./godot-bin --headless --path godot -s res://tests/run_net_spike.gd
      - name: Scene parse check
        run: ./godot-bin --headless --path godot -s res://tests/parse_check.gd

  content-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deterministic sim + content-tree validation (node --test)
        run: npm test

  # Render the new HUD (with the ResearchPanel) under a virtual display and publish it as an artifact,
  # so the Godot build's UI is inspectable without a local engine. Windowed (not --headless) so the
  # viewport actually renders; xvfb supplies the offscreen display.
  godot-hud-screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Download Godot 4.7
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -O https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot-bin
          chmod +x godot-bin
      - name: Render newhud + capture screenshot
        run: |
          # import assets headlessly first so the scene loads cleanly, then run windowed under xvfb
          ./godot-bin --headless --path godot --import || true
          xvfb-run -a --server-args="-screen 0 1280x720x24" \
            ./godot-bin --path godot --resolution 1280x720 res://newhud.tscn -- newhud shot light
      - name: Show result
        run: ls -la godot/newhud_shot.png godot/newhud_thumb.png && file godot/newhud_shot.png
      - name: Emit thumb as base64 (log readback channel)
        run: |
          echo "NEWHUD_THUMB_B64_BEGIN"
          base64 -w 120 godot/newhud_thumb.png
          echo "NEWHUD_THUMB_B64_END"
      - name: Upload HUD screenshot
        uses: actions/upload-artifact@v4
        with:
          name: newhud-screenshot
          path: |
            godot/newhud_shot.png
            godot/newhud_thumb.png
          if-no-files-found: error

  # Click-and-play deliverable: export the Web build (preset "Web", threads OFF — runs on any static
  # hosting, no COOP/COEP) and publish it as an artifact, so every push yields a playable build
  # without a local engine. Export templates come from the official 1.25 GB .tpz: GitHub's CDN does
  # not serve HTTP range requests reliably, so it is downloaded whole (transient) and only the
  # templates/web_* members are kept — cached between runs, so the big download happens once.
  godot-web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -O https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot-bin
          chmod +x godot-bin
      - name: Cache web export templates
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.stable
          key: godot-export-templates-4.7-stable-web
      - name: Fetch web export templates (cache miss)
        if: steps.templates-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -O https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -j -q Godot_v4.7-stable_export_templates.tpz "templates/web_*" "templates/version.txt" \
            -d ~/.local/share/godot/export_templates/4.7.stable
          rm Godot_v4.7-stable_export_templates.tpz
      - name: Export Web build
        run: |
          # import first: exporting from a fresh checkout without the .godot cache misses resources;
          # mkdir because the headless exporter refuses to create the target folder itself
          mkdir -p godot/build/web
          ./godot-bin --headless --path godot --import
          ./godot-bin --headless --path godot --export-release "Web" build/web/index.html
      # the exporter can leave a broken build behind a zero exit code — gate on the artifacts themselves
      - name: Verify build artifacts
        run: |
          for f in index.html index.wasm index.pck index.js; do
            test -s "godot/build/web/$f" || { echo "missing or empty: $f"; exit 1; }
          done
          printf '%s\n' \
            "RealWorld — Godot Web build (клік-і-грай)" \
            "" \
            "1. Розпакуй архів у теку." \
            "2. У теці:  python3 -m http.server 8792" \
            "3. Відкрий  http://localhost:8792  (з file:// не працює)." \
            > godot/build/web/README.txt
          ls -la godot/build/web
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: godot/build/web
          if-no-files-found: error

  # Phone build: the same game as an installable APK (arm64, landscape, touch frame — see
  # newhud_main.gd _setup_touch). GitHub's ubuntu runners ship the Android SDK (platform-tools +
  # build-tools/apksigner) and JDK 17, so Godot's own export + signing runs as on a dev machine.
  # Signing: a repository secret ANDROID_RELEASE_KEYSTORE_B64 (+ _USER/_PASSWORD) gives stable
  # update-in-place releases; without it a CI keystore is generated once and CACHED, so successive
  # artifacts still install over each other.
  godot-android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -O https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot-bin
          chmod +x godot-bin
      - name: Cache Android export templates
        id: android-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/4.7.stable
          key: godot-export-templates-4.7-stable-android
      - name: Fetch Android export templates (cache miss)
        if: steps.android-templates.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 10 --connect-timeout 30 -O https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -j -q Godot_v4.7-stable_export_templates.tpz "templates/android_debug.apk" "templates/android_release.apk" \
            "templates/version.txt" -d ~/.local/share/godot/export_templates/4.7.stable
          rm Godot_v4.7-stable_export_templates.tpz
      - name: Cache the CI signing keystore
        uses: actions/cache@v4
        with:
          path: ~/.android-ci
          key: realworld-android-ci-keystore-v1
      - name: Signing keys + editor settings
        env:
          RELEASE_KS_B64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_B64 }}
          RELEASE_KS_USER: ${{ secrets.ANDROID_RELEASE_KEYSTORE_USER }}
          RELEASE_KS_PASS: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ~/.android-ci ~/.config/godot
          JDK="${JAVA_HOME_17_X64:-$JAVA_HOME}"
          KT="$JDK/bin/keytool"
          if [ ! -f ~/.android-ci/debug.keystore ]; then
            "$KT" -genkeypair -keystore ~/.android-ci/debug.keystore -storetype PKCS12 -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ -n "$RELEASE_KS_B64" ]; then
            echo "$RELEASE_KS_B64" | base64 -d > ~/.android-ci/release.keystore
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_KS_USER" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RELEASE_KS_PASS" >> "$GITHUB_ENV"
          else
            if [ ! -f ~/.android-ci/release.keystore ]; then
              "$KT" -genkeypair -keystore ~/.android-ci/release.keystore -storetype PKCS12 -storepass realworld-ci \
                -alias realworld -keypass realworld-ci -keyalg RSA -keysize 3072 -validity 18250 -dname "CN=RealWorld CI,O=SSD,C=UA"
            fi
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=realworld" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=realworld-ci" >> "$GITHUB_ENV"
          fi
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android-ci/release.keystore" >> "$GITHUB_ENV"
          printf '%s\n' '[gd_resource type="EditorSettings" format=3]' '' '[resource]' \
            "export/android/android_sdk_path = \"$ANDROID_HOME\"" \
            "export/android/java_sdk_path = \"$JDK\"" \
            "export/android/debug_keystore = \"$HOME/.android-ci/debug.keystore\"" \
            'export/android/debug_keystore_user = "androiddebugkey"' \
            'export/android/debug_keystore_pass = "android"' > ~/.config/godot/editor_settings-4.7.tres
      - name: Export Android APK
        run: |
          mkdir -p godot/build/android
          ./godot-bin --headless --path godot --import
          ./godot-bin --headless --path godot --export-release "Android" build/android/RealWorld.apk
      # gate on the artifact itself (the exporter can exit 0 on a soft failure): present + signed v2
      - name: Verify APK
        run: |
          APK=godot/build/android/RealWorld.apk
          test -s "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose "$APK" | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt
          ls -la "$APK"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: godot/build/android/RealWorld.apk
          if-no-files-found: error

  gdlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      # config lives in gdlintrc at the repo root; scripts/main.gd is the FROZEN pre-refactor HUD
      # reference (excluded here, not in the config — gdlintrc has no per-file excludes)
      - name: Lint product scripts
        run: gdlint $(find godot/scripts -name "*.gd" ! -name "main.gd") godot/newhud_main.gd
