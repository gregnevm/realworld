name: Godot Tests

on:
  push:
  pull_request:

jobs:
  godot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Godot 4.7
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q Godot_v4.7-stable_linux.x86_64.zip
          mv Godot_v4.7-stable_linux.x86_64 godot-bin
          chmod +x godot-bin
      # every suite is leak-gated: RefCounted cycles (Thing<->Comp etc.) print an ObjectDB warning at
      # exit instead of failing the run, so the gate greps for it — leaks must not return silently.
      # ONE loop, one gate: adding a suite = adding a name to the list (no copy-pasted gate to forget)
      - name: Headless suites (leak-gated)
        run: |
          set -o pipefail
          for suite in run_tests run_kernel_tests run_catalog_tests run_progression_tests run_ui_tests run_smoke; do
            echo "=== $suite ==="
            ./godot-bin --headless --path godot -s "res://tests/$suite.gd" 2>&1 | tee suite.log
            ! grep -q "ObjectDB instances were leaked" suite.log
          done
      - name: Scene parse check
        run: ./godot-bin --headless --path godot -s res://tests/parse_check.gd

  content-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deterministic sim + content-tree validation (node --test)
        run: npm test

  gdlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"
      # config lives in gdlintrc at the repo root; scripts/main.gd is the FROZEN pre-refactor HUD
      # reference (excluded here, not in the config — gdlintrc has no per-file excludes)
      - name: Lint product scripts
        run: gdlint $(find godot/scripts -name "*.gd" ! -name "main.gd") godot/newhud_main.gd
